{% extends 'base.html' %}
{% block content %}
<section class="gallery-intro"><p class="eyebrow">HOME</p><h1>Interactive STEM learning modules</h1><p class="lead">Choose a module, change one thing at a time, and explain the evidence you see.</p></section>
<section class="module-grid" aria-label="Learning modules">
{% for module in modules %}<a class="module-card" href="{{ url_for('lesson', module_id=module.id) }}"><h2>{{ module.title }}</h2><p>{{ module.subtitle }}</p><span class="card-link">Open module →</span></a>{% endfor %}
</section>
{% endblock %}
