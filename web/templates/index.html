{% extends 'base.html' %}
{% block content %}
<section class="gallery-intro"><h1>Modules</h1><p class="lead">Interactive data-science tools.</p></section>
<section class="module-grid" aria-label="Learning modules">
{% for module in modules %}<a class="module-card" href="{{ url_for('lesson', module_id=module.id) }}"><h2>{{ module.title }}</h2><p>{{ module.subtitle }}</p><span class="card-link">Open module →</span></a>{% endfor %}
</section>
{% endblock %}
